<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half Sheet Maker</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1f2937;--line:#d1d5db;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f3f4f6;--line:#374151;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
button,select,input[type=number]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:14px;display:flex;align-items:center;gap:4px}
main{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:12px;padding:12px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{width:100%;height:340px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.help{font-size:12px;opacity:.8;margin:6px 0}
#warn{color:#dc2626;font-size:13px;min-height:18px}
#lib{list-style:none;padding:0;margin:6px 0 0}
#lib li{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
#lib li span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lib button{padding:2px 8px}
#wrap{overflow:auto;padding:8px;background:#9ca3af;border-radius:8px;text-align:center}
.sheet{background:#fff;color:#000;box-sizing:border-box;padding:.4in;overflow:hidden;text-align:left;font-family:Georgia,"Times New Roman",serif;line-height:1.3;display:inline-block;vertical-align:top;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.portrait .sheet{width:5.5in;height:8.5in}
.landscape .sheet,.two .sheet{width:8.5in;height:5.5in}
.side .sheet{width:5.5in;height:8.5in}
.sheet h1{font-size:1.7em;margin:0 0 .4em;border-bottom:2px solid #000;padding-bottom:.15em}
.sheet h2{font-size:1.25em;margin:.7em 0 .2em}
.sheet h3{font-size:1.05em;margin:.6em 0 .2em}
.sheet p{margin:.3em 0}
.sheet ul{margin:.2em 0 .4em 1.2em;padding:0}
.boxes .sheet h2::before{content:"";display:inline-block;width:.75em;height:.75em;border:2px solid #000;margin-right:.5em;vertical-align:-.05em}
.dup{display:none}
.two .dup,.side .dup{display:inline-block}
.two .sheet{display:block;margin:0 auto}
.two .dup{border-top:1px dashed #666}
.side .dup{border-left:1px dashed #666}
.side #wrap{white-space:nowrap}
.sheet{white-space:normal}
#pg{display:none}
@media print{
  header,.panel,#warn{display:none!important}
  body,main{background:#fff;display:block;padding:0;margin:0}
  #wrap{background:none;padding:0;overflow:visible;border-radius:0}
  .sheet{box-shadow:none}
  .two #wrap{width:8.5in;height:11in;overflow:hidden}
  .two .sheet{display:block;height:5.5in;margin:0}
  .side #wrap{width:11in;height:8.5in;overflow:hidden;text-align:left}
}
</style>
<style id="page"></style>
</head>
<body>
<header>
  <h1>Half Sheet Maker</h1>
  <button class="primary" id="pdf">Save as PDF</button>
  <button id="save">Save to browser</button>
  <button id="json">Download JSON</button>
  <button id="load">Load JSON</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button id="tpl">Choices template</button>
  <button id="new">New</button>
</header>
<main>
  <section class="panel">
    <textarea id="md" spellcheck="false" aria-label="Markdown"></textarea>
    <div class="help"><code># Title</code> &nbsp; <code>## Header</code> &nbsp; <code>### Subheader</code> &nbsp; <code>- item</code> &nbsp; <code>**bold**</code> &nbsp; <code>*italic*</code> &nbsp; plain lines become paragraphs.</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <label>Layout
        <select id="layout">
          <option value="portrait">Half sheet, portrait (5.5 × 8.5 in)</option>
          <option value="landscape">Half sheet, landscape (8.5 × 5.5 in)</option>
          <option value="two">Two copies per page, one above the other (letter portrait)</option>
          <option value="side">Two copies per page, side by side (letter landscape)</option>
        </select>
      </label>
      <label>Font <input type="number" id="size" min="8" max="28" value="14" style="width:64px"> pt</label>
      <label><input type="checkbox" id="boxes"> Checkbox before ## headers</label>
    </div>
    <div id="warn"></div>
    <strong style="font-size:14px">Saved in this browser</strong>
    <ul id="lib"></ul>
  </section>
  <section>
    <div id="app" class="portrait">
      <div id="wrap"><div class="sheet" id="s1"></div><div class="sheet dup" id="s2"></div></div>
    </div>
  </section>
</main>
<script>
const TEMPLATE = "# Choices\n## Timer\n## Stopwatch\n## Login Screen\n## Social Media Landing Page\n## Other approved option * approved by instructor\n";
const $ = id => document.getElementById(id);
const md = $('md'), layout = $('layout'), size = $('size'), boxes = $('boxes');
const CUR = 'hsm.current', LIB = 'hsm.library';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*?)\*/g,'<i>$1</i>');
}
function toHtml(text){
  let out = '', inList = false;
  for (const raw of text.split('\n')) {
    const l = raw.trimEnd(), m = l.match(/^(#{1,3})\s+(.*)$/), li = l.match(/^\s*[-*+]\s+(.*)$/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (m) out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
    else if (l.trim()) out += '<p>' + inline(l) + '</p>';
  }
  return out + (inList ? '</ul>' : '');
}
function titleOf(text){
  const m = text.match(/^#\s+(.+)$/m); return m ? m[1].trim() : 'Untitled';
}
function state(){return {md: md.value, layout: layout.value, size: +size.value || 14, boxes: boxes.checked}}
function apply(s){
  md.value = s.md || ''; layout.value = s.layout || 'portrait';
  size.value = s.size || 14; boxes.checked = !!s.boxes; render();
}
function render(){
  const html = toHtml(md.value);
  for (const id of ['s1','s2']) { const e = $(id); e.innerHTML = html; e.style.fontSize = size.value + 'pt'; }
  const app = $('app'); app.className = layout.value + (boxes.checked ? ' boxes' : '');
  const pg = {portrait:'5.5in 8.5in', landscape:'8.5in 5.5in', two:'8.5in 11in', side:'11in 8.5in'}[layout.value];
  $('page').textContent = `@page{size:${pg};margin:0}`;
  const s1 = $('s1');
  $('warn').textContent = s1.scrollHeight > s1.clientHeight + 2 ? 'Content is too long for one half sheet. Shorten the text or reduce the font size.' : '';
  document.title = titleOf(md.value) + ' - Half Sheet Maker';
  try { localStorage.setItem(CUR, JSON.stringify(state())); } catch(e){}
}
function getLib(){try{return JSON.parse(localStorage.getItem(LIB))||[]}catch(e){return []}}
function setLib(a){try{localStorage.setItem(LIB, JSON.stringify(a))}catch(e){alert('Browser storage is unavailable.')}drawLib()}
function drawLib(){
  const ul = $('lib'); ul.innerHTML = '';
  const lib = getLib();
  if (!lib.length) { ul.innerHTML = '<li style="opacity:.7">Nothing saved yet.</li>'; return; }
  lib.forEach(it => {
    const li = document.createElement('li');
    const sp = document.createElement('span'); sp.textContent = it.title; sp.title = 'Open';
    sp.onclick = () => apply(it);
    const del = document.createElement('button'); del.textContent = 'Delete';
    del.onclick = () => { if (confirm('Delete "' + it.title + '"?')) setLib(getLib().filter(x => x.id !== it.id)); };
    li.append(sp, del); ul.append(li);
  });
}
$('save').onclick = () => {
  const s = state(), base = titleOf(s.md), lib = getLib();
  const family = lib.filter(x => (x.base || x.title) === base);
  const dupe = family.find(x => x.md === s.md);
  if (dupe) { Object.assign(dupe, s, {saved: new Date().toISOString()}); setLib(lib); return; }
  let title = base;
  if (family.length) {
    const used = new Set(family.map(x => x.title));
    let n = 0;
    do { title = base + ' v' + String(n++).padStart(2, '0'); } while (used.has(title));
  }
  lib.unshift({...s, title, base, id: Date.now(), saved: new Date().toISOString()});
  setLib(lib);
};
$('json').onclick = () => {
  const s = state(), data = {app:'half-sheet-maker', version:1, title:titleOf(s.md), ...s};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}));
  a.download = (data.title.replace(/[^\w\-]+/g,'_') || 'half-sheet') + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('load').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (typeof d.md !== 'string') throw 0; apply(d); }
    catch(err) { alert('That file is not a valid half sheet JSON.'); }
  };
  r.readAsText(f); e.target.value = '';
};
$('pdf').onclick = () => { render(); window.print(); };
$('tpl').onclick = () => { apply({md: TEMPLATE, layout: layout.value, size: +size.value, boxes: boxes.checked}); };
$('new').onclick = () => { if (!md.value.trim() || confirm('Clear the editor? Saved sheets are kept.')) apply({md:'', layout:layout.value, size:+size.value, boxes:boxes.checked}); };
[md, layout, size, boxes].forEach(el => el.addEventListener('input', render));

let init = null;
try { init = JSON.parse(localStorage.getItem(CUR)); } catch(e){}
apply(init && typeof init.md === 'string' ? init : {md: TEMPLATE, layout:'portrait', size:14, boxes:false});
drawLib();
</script>
</body>
</html>
